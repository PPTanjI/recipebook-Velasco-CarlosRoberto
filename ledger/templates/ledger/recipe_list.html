{% extends "ledger/base.html" %}

{% block page_heading %}
Recipe List
{% endblock %}

{% block content %}
<ul>
    {% for recipe in recipes %}
        <li>
            <a href="{{ recipe.get_absolute_url }}">
                {{ recipe.name }}
            </a>
        </li>
    {% endfor %}
</ul>

{% if user.is_authenticated %}
    <p>
        <a href="{% url 'recipe_add' %}">Add Recipe</a>
    </p>
{% endif %}

{% endblock %}
